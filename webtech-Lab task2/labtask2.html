<!DOCTYPE html>
<html>
	<head>
		<title>Regform</title>
		<link rel = "stylesheet" href ="style.css">
	</head>
	
	
	<body>
	
	<h1>
	Registration Form
	
	</h1>
		<form>
		<label for = "Name"> Name </label>
		<input type= "Name" id = "Name" name= "Name" required><br><br>
		
		<label for = "Email"> Email </label>
		<input type= "Email" id = "Email" name= "Email"><br><br>
		
		<label for = "Password"> Password </label>
		<input type= "Password" id = "Password" name= "Password"><br><br>
		
		<label for = "Gender"> Gender </label>
		<input type="radio" id="Gender1" name="Gender" value="Male"> Male
		<input type="radio" id="Gender2" name="Gender" value="Female"> Female<br><br>
		
		<label for = "Religion"> Religion </label>
		<input type= "Checkbox" id = "r1" name= "r1" value= "Islam"> Islam
		<input type= "Checkbox" id = "r2" name= "r2" value= "Hindhu"> Hindhu<br><br>
		
		<div>
		<label for = "Department" > Department: </label>
		<select name= " Department">
			<option value= "CSE" selected> CSE</option>
			<option value= "EEE"> EEE</option>
		</select>
		</div><br><br>
		
		
		<div>
		<label for = "Address"> Write down the address: </label>
		<textarea rows= "15"></textarea>
		</div><br><br>
		
		
		<div>
			<input type = "Submit" value= "Register">
			<input type="reset" value="Clear">		
		
		</div><br><br>
		
			
		
		
		</form>
		
		
		
		
		
	</body>



</html>
